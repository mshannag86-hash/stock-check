[project]
name = "stock-check"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.122.0",
    "bcrypt>=5.0.0",
    "google-genai>=2.18.1",
    "openai>=3.0.0",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
    "python-dotenv>=1.2.2",
    "streamlit>=1.61.1",
    "supabase>=2.31.0",
    "yfinance>=1.6.0",
]

[project.scripts]
stock-check = "stock_check:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
